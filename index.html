<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DOGU7 – Konzert Erinnerung</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#06000e;-webkit-text-size-adjust:100%;}
button,a{-webkit-appearance:none;-moz-appearance:none;appearance:none;background:none;border:none;outline:none;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.uni{width:100%;height:100%;overflow:hidden;position:relative;font-family:'Inter',sans-serif;color:#fff;}
.stars-bg{position:fixed;inset:0;pointer-events:none;z-index:1;}
.star-bg{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:.1;}100%{opacity:.9;}}
canvas#shootCanvas{position:fixed;inset:0;pointer-events:none;z-index:2;}
.gift-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .9s,transform .9s;padding:2rem;background:radial-gradient(ellipse at center,rgba(80,0,120,.35) 0%,#06000e 70%);}
.gift-screen.gone{opacity:0;pointer-events:none;transform:scale(1.05);}
.gift-video-wrap{width:190px;height:190px;border-radius:16px;overflow:hidden;border:1.5px solid rgba(180,100,255,.5);box-shadow:0 0 50px rgba(120,0,200,.6);margin-bottom:24px;background:#1a0030;}
.gift-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.gift-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:5px;color:#c9a84c;text-transform:uppercase;text-align:center;margin-bottom:8px;}
.gift-headline{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#f0d080;text-align:center;line-height:1.5;margin-bottom:8px;text-shadow:0 0 30px rgba(212,175,55,.7);}
.gift-sub{font-size:13px;color:#c084fc;text-align:center;letter-spacing:1px;margin-bottom:32px;line-height:1.8;}
.tap-area{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:#f0d080;border:1px solid rgba(212,175,55,.5);padding:13px 30px;border-radius:50px;background:rgba(212,175,55,.07);text-align:center;cursor:pointer;}
.seven-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,rgba(80,0,120,.5) 0%,#06000e 70%);}
.seven-screen.show{animation:sevReveal 4s ease forwards;}
@keyframes sevReveal{0%{opacity:0;}8%{opacity:1;}75%{opacity:1;}100%{opacity:0;}}
.seven-num{font-family:'Cinzel',serif;font-size:120px;font-weight:700;color:#f0d080;letter-spacing:8px;text-shadow:0 0 60px rgba(212,175,55,.9),0 0 120px rgba(212,175,55,.5);animation:fadeIO 4s ease forwards;}
@keyframes fadeIO{0%{opacity:0;}15%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.player-screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;z-index:8;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.player-screen.show{opacity:1;pointer-events:all;transition:opacity .8s ease .3s;}
.player-header{position:relative;width:100%;height:220px;overflow:hidden;flex-shrink:0;background:radial-gradient(ellipse at 50% 30%,rgba(80,0,150,.8) 0%,#06000e 70%);}
.player-header video{width:100%;height:100%;object-fit:cover;opacity:.55;display:block;}
.player-header-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,0,14,.2) 0%,rgba(6,0,14,1) 100%);}
.player-header-text{position:absolute;bottom:16px;left:18px;}
.player-header-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:5px;color:#c9a84c;margin-bottom:4px;}
.player-header-title{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 20px rgba(180,100,255,.9);}
.player-body{background:#06000e;padding:0 1.2rem 2rem;flex:1;}
.orb-wrap{display:flex;justify-content:center;margin:1.4rem 0 1rem;}
.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(180,100,255,.9),rgba(60,0,120,.8));box-shadow:0 0 30px rgba(120,0,200,.7);animation:orbPulse 2s ease-in-out infinite;}
@keyframes orbPulse{0%,100%{box-shadow:0 0 30px rgba(120,0,200,.7);}50%{box-shadow:0 0 55px rgba(180,100,255,.9),0 0 90px rgba(120,0,200,.4);}}
.track-info{text-align:center;margin-bottom:1rem;}
.track-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:#f0f0f0;}
.progress-wrap{margin-bottom:.8rem;}
.progress-bar{width:100%;height:4px;background:rgba(120,0,200,.2);border-radius:2px;cursor:pointer;}
.progress-fill{height:100%;background:linear-gradient(90deg,#7b3fd4,#c084fc);border-radius:2px;width:0%;transition:width .1s linear;}
.time-row{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:#7b5fa0;}
.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:1rem;}
.btn-skip{width:48px;height:48px;border-radius:50%;background:rgba(123,63,212,.25);border:1px solid rgba(123,63,212,.5);color:#c084fc;font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-play{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#7b3fd4,#3b0070);box-shadow:0 0 20px rgba(120,0,200,.6);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-skip:active,.btn-play:active{transform:scale(.93);}
.vol-row{display:flex;align-items:center;gap:10px;margin-bottom:1.2rem;}
.vol-icon{font-size:14px;color:#7b5fa0;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,#7b3fd4 var(--v,80%),rgba(120,0,200,.2) var(--v,80%));outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#c084fc;box-shadow:0 0 6px rgba(180,100,255,.8);}
canvas#viz{width:100%;height:50px;display:block;margin-bottom:1rem;opacity:.7;}
.playlist-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:#c9a84c;margin-bottom:.8rem;}
.playlist{display:flex;flex-direction:column;gap:8px;margin-bottom:1.2rem;}
.pl-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:rgba(120,0,200,.08);border:1px solid rgba(120,0,200,.15);cursor:pointer;}
.pl-item.active{background:rgba(120,0,200,.22);border-color:rgba(180,100,255,.4);}
.pl-num{font-size:11px;color:#7b5fa0;width:16px;text-align:center;}
.pl-title{font-size:13px;font-weight:500;color:#e8e0f5;}
.yt-link{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;padding:11px 22px;border-radius:50px;background:rgba(0,200,80,.1);border:1px solid rgba(0,255,100,.35);color:#00e676;font-size:12px;letter-spacing:2px;text-decoration:none;font-family:'Cinzel',serif;width:fit-content;}
.footer{text-align:center;padding:12px 1.5rem 2rem;border-top:.5px solid rgba(180,100,255,.15);margin-top:1rem;}
.footer p{font-size:10px;color:#6b4fa0;letter-spacing:1px;font-style:italic;}
</style>
</head>
<body>
<div class="uni">
  <div class="stars-bg" id="stars"></div>
  <canvas id="shootCanvas"></canvas>

  <div class="gift-screen" id="gift">
    <div class="gift-video-wrap">
      <video id="vid1" src="konzert.mp4" muted loop playsinline webkit-playsinline preload="none"></video>
    </div>
    <p class="gift-label">Team 7 präsentiert</p>
    <h1 class="gift-headline">Konzert Erinnerung</h1>
    <p class="gift-sub">DANKE 💜💚</p>
    <div class="tap-area" id="giftBtn">▶ Abspielen</div>
  </div>

  <div class="seven-screen" id="seven">
    <p class="seven-num">7</p>
  </div>

  <div class="player-screen" id="player">
    <div class="player-header">
      <video id="vid3" src="konzert.mp4" muted loop playsinline webkit-playsinline preload="none"></video>
      <div class="player-header-overlay"></div>
      <div class="player-header-text">
        <p class="player-header-label">Konzert Erinnerung</p>
        <p class="player-header-title">Die Nacht bleibt</p>
      </div>
    </div>
    <div class="player-body">
      <div class="orb-wrap"><div class="orb" id="orbEl"></div></div>
      <div class="track-info"><p class="track-title" id="trackTitle">BOMBA</p></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>
        <div class="time-row"><span id="tNow">0:00</span><span id="tTotal">0:00</span></div>
      </div>
      <div class="controls">
        <div class="btn-skip" id="btnPrev">«</div>
        <div class="btn-play" id="btnPlay">▶</div>
        <div class="btn-skip" id="btnNext">»</div>
      </div>
      <div class="vol-row">
        <span class="vol-icon">🔈</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
        <span class="vol-icon">🔊</span>
      </div>
      <canvas id="viz" height="50"></canvas>
      <p class="playlist-label">DOGU SONGS</p>
      <div class="playlist" id="playlist"></div>
      <a class="yt-link" href="https://www.youtube.com/@Team7Official7" target="_blank">📺 Zu den Videos</a>
      <div class="footer"><p>✦ Konzert Erinnerung · Team 7 · Die Nacht bleibt ✦</p></div>
    </div>
  </div>
</div>

<script>
// Stars
const sd=document.getElementById('stars');
for(let i=0;i<90;i++){const s=document.createElement('div');s.className='star-bg';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;sd.appendChild(s);}

// Shooting stars
const sc=document.getElementById('shootCanvas'),ctx=sc.getContext('2d');let ss=[];
function rsz(){sc.width=innerWidth;sc.height=innerHeight;}window.addEventListener('resize',rsz);rsz();
function spawnStar(){const W=sc.width,H=sc.height,fl=Math.random()<.5;const x=fl?Math.random()*W*.35:W*.65+Math.random()*W*.35;const y=Math.random()*H*.35;const spd=1+Math.random()*1.3;const ang=Math.PI/4+Math.random()*.4;ss.push({x,y,vx:(fl?1:-1)*spd*Math.cos(ang),vy:spd*Math.sin(ang),life:1,len:80+Math.random()*70});}
(function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,sc.width,sc.height);ss=ss.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.life-=.013;if(s.life<=0)return false;const tx=s.x-s.vx*(s.len/Math.max(Math.abs(s.vx),.01))*.45;const ty=s.y-s.vy*(s.len/Math.max(Math.abs(s.vx),.01))*.45;const g=ctx.createLinearGradient(tx,ty,s.x,s.y);g.addColorStop(0,'rgba(200,150,255,0)');g.addColorStop(1,`rgba(230,180,255,${s.life*.65})`);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.strokeStyle=g;ctx.lineWidth=1.8;ctx.stroke();return true;});})();
setInterval(spawnStar,2200);

// Tracks - externe MP3 Dateien
const TRACKS=[
  {title:'BOMBA',src:'bomba.mp3'},
  {title:'GİDEMEM',src:'gidemem.mp3'}
];
let cur=0,playing=false;
const aud=new Audio();
aud.volume=.8;

function loadTrack(i){cur=i;aud.src=TRACKS[i].src;document.getElementById('trackTitle').textContent=TRACKS[i].title;document.getElementById('progFill').style.width='0%';document.getElementById('tNow').textContent='0:00';document.getElementById('tTotal').textContent='0:00';document.querySelectorAll('.pl-item').forEach((el,j)=>el.classList.toggle('active',j===i));}
function play(){aud.play().then(()=>{playing=true;document.getElementById('btnPlay').textContent='⏸';initViz();}).catch(e=>console.log(e));}
function pause(){aud.pause();playing=false;document.getElementById('btnPlay').textContent='▶';}
function toggle(){if(!aud.src||aud.src===location.href)loadTrack(0);playing?pause():play();}

document.getElementById('btnPlay').addEventListener('click',toggle);
document.getElementById('btnPrev').addEventListener('click',()=>{loadTrack((cur-1+TRACKS.length)%TRACKS.length);if(playing)play();});
document.getElementById('btnNext').addEventListener('click',()=>{loadTrack((cur+1)%TRACKS.length);if(playing)play();});
aud.addEventListener('ended',()=>{loadTrack((cur+1)%TRACKS.length);play();});
aud.addEventListener('timeupdate',()=>{if(!aud.duration)return;const p=(aud.currentTime/aud.duration)*100;document.getElementById('progFill').style.width=p+'%';document.getElementById('tNow').textContent=fmt(aud.currentTime);document.getElementById('tTotal').textContent=fmt(aud.duration);});
document.getElementById('progBar').addEventListener('click',e=>{if(!aud.duration)return;const r=e.currentTarget.getBoundingClientRect();aud.currentTime=((e.clientX-r.left)/r.width)*aud.duration;});
document.getElementById('volSlider').addEventListener('input',function(){aud.volume=this.value;this.style.setProperty('--v',this.value*100+'%');});
function fmt(s){const m=Math.floor(s/60),ss2=Math.floor(s%60);return m+':'+(ss2<10?'0':'')+ss2;}

// Playlist
const plDiv=document.getElementById('playlist');
TRACKS.forEach((t,i)=>{const el=document.createElement('div');el.className='pl-item'+(i===0?' active':'');el.innerHTML=`<span class="pl-num">${i+1}</span><div class="pl-info"><p class="pl-title">${t.title}</p></div>`;el.addEventListener('click',()=>{loadTrack(i);play();});plDiv.appendChild(el);});

// Visualizer
let vizOk=false,analyser,fdata;
const vizC=document.getElementById('viz'),vCtx=vizC.getContext('2d');
function initViz(){if(vizOk)return;vizOk=true;try{const ac=new(window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(aud);analyser=ac.createAnalyser();analyser.fftSize=128;src.connect(analyser);analyser.connect(ac.destination);fdata=new Uint8Array(analyser.frequencyBinCount);(function dv(){requestAnimationFrame(dv);if(!analyser)return;analyser.getByteFrequencyData(fdata);const W=vizC.width,H=vizC.height;vCtx.clearRect(0,0,W,H);const bw=W/fdata.length;for(let i=0;i<fdata.length;i++){const h=(fdata[i]/255)*H;const g=vCtx.createLinearGradient(0,H,0,H-h);g.addColorStop(0,'rgba(123,63,212,.8)');g.addColorStop(1,'rgba(192,132,252,.3)');vCtx.fillStyle=g;vCtx.fillRect(i*bw+1,H-h,bw-1,h);}})();}catch(e){}}
window.addEventListener('resize',()=>{vizC.width=vizC.clientWidth;});setTimeout(()=>vizC.width=vizC.clientWidth,100);

// Gift open
let opened=false;
function openGift(){
  if(opened)return;opened=true;
  document.getElementById('vid1').load();document.getElementById('vid1').play().catch(()=>{});
  for(let i=0;i<6;i++)setTimeout(spawnStar,i*100);
  document.getElementById('gift').classList.add('gone');
  const sv=document.getElementById('seven');
  sv.style.animation='none';void sv.offsetWidth;
  sv.style.animation='sevReveal 4s ease forwards';
  let si=setInterval(spawnStar,700);
  setTimeout(()=>{
    clearInterval(si);
    document.getElementById('player').classList.add('show');
    document.getElementById('vid3').play().catch(()=>{});
    loadTrack(0);
    setInterval(spawnStar,2500);
  },4300);
}
document.getElementById('giftBtn').addEventListener('click',openGift);
document.getElementById('gift').addEventListener('click',openGift);
loadTrack(0);
</script>
</body>
</html>
